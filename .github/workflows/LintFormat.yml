name: 'Auto-Linter-Formatter'
on:
  push:

jobs:
  Auto-Linter:
    name: Auto-Linter
    runs-on: ubuntu-latest  #普通に仮想環境で実行？
    steps:
      - name: CheckOut
        uses: actions/checkout@v3
      - name: Install packages
        run: npm install
      - name: Prettier
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Chack for changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Code changes detected after lint or format:"
            git diff
          else
            echo "No changes detected after lint or format"
          fi
      - name: Run tests
        run: npm test
      - name: Build
        run: npm build


  GitCommit:
    name: GitCommit
    needs: Auto-Linter
    runs-on: ubuntu-latest
    steps:
      - name: CheckOut
        uses: actions/checkout@v3
      - name: Git Config
        run: |
          git config --local user.name "nagayamat"
          git config --local user.email "tomo.game10@gmail.com"
      - name: Get Branch Name
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
      - name: Commit Files
        env:
          BRANCH_NAME: ${{ steps.extract_branch.outputs.branch }}
        run: |      #mergeログが残らない
          git pull --rebase
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Commited by Actions"
            git push origin $BRANCH_NAME
          else
            echo "No changes to commit"
          fi



